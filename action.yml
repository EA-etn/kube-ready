name: kube-ready
description: Check Kubernetes manifests for production readiness (resources, probes, security, replicas) and upload SARIF to code scanning.
author: EA-etn
branding:
  icon: check-circle
  color: blue

inputs:
  path:
    description: Files or directories to check (space-separated).
    required: false
    default: "."
  fail-on:
    description: Lowest severity that fails the step (error, warning, info, never).
    required: false
    default: error
  config:
    description: Path to a .kube-ready.yaml config file.
    required: false
    default: ""
  disable:
    description: Comma-separated rule ids to skip.
    required: false
    default: ""
  sarif-file:
    description: If set, also write a SARIF report here (upload it with github/codeql-action/upload-sarif).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Install kube-ready
      shell: bash
      run: python -m pip install --quiet "${{ github.action_path }}"

    - name: kube-ready
      shell: bash
      env:
        KR_PATH: ${{ inputs.path }}
        KR_FAIL_ON: ${{ inputs.fail-on }}
        KR_CONFIG: ${{ inputs.config }}
        KR_DISABLE: ${{ inputs.disable }}
        KR_SARIF: ${{ inputs.sarif-file }}
      run: |
        args=()
        [ -n "$KR_CONFIG" ] && args+=(--config "$KR_CONFIG")
        [ -n "$KR_DISABLE" ] && args+=(--disable "$KR_DISABLE")
        # shellcheck disable=SC2086
        if [ -n "$KR_SARIF" ]; then
          kube-ready check $KR_PATH "${args[@]}" --format sarif --output "$KR_SARIF" --fail-on never
        fi
        # shellcheck disable=SC2086
        kube-ready check $KR_PATH "${args[@]}" --verbose --fail-on "$KR_FAIL_ON"
