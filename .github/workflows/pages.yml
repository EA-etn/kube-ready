name: Playground

# Publishes playground/ to GitHub Pages with the wheel built from main, so the page runs the
# same code as the CLI, in the visitor's browser (Pyodide). No server, nothing uploaded.
on:
  push:
    branches: [main]
    paths: [playground/**, src/**, pyproject.toml, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # The workflow token cannot create the Pages site. Until the owner enables it once
      # (Settings → Pages → Build and deployment → Source: GitHub Actions) this job skips with
      # a notice instead of failing the push.
      - id: pages
        name: Is GitHub Pages enabled?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" --silent 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Playground not published::Enable GitHub Pages (Settings → Pages → Source: GitHub Actions) and re-run this workflow."
          fi
      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - if: steps.pages.outputs.enabled == 'true'
        name: Build the wheel and assemble the site
        run: |
          pip install --quiet build
          python -m build --wheel --outdir dist
          mkdir -p site
          cp playground/index.html site/
          cp dist/*.whl site/
          basename dist/*.whl > site/wheel.txt
          cat site/wheel.txt
      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: site
      - if: steps.pages.outputs.enabled == 'true'
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
