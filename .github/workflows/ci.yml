name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint and test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy --strict src
      - run: pytest

  dogfood:
    name: Check the example manifests with the action itself
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload SARIF to the Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The SARIF that reaches the Security tab comes from the good examples, so the tab shows the
      # integration working with zero alerts instead of 29 deliberate ones from examples/bad.
      - name: The good examples pass at the strictest level (and upload SARIF)
        uses: ./
        with:
          path: examples/good
          fail-on: info
          sarif-file: report.sarif

      - name: The bad examples are caught (findings as annotations, no SARIF upload)
        uses: ./
        with:
          path: examples/bad
          fail-on: never

      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always()
        with:
          sarif_file: report.sarif
          category: kube-ready-examples

  docker:
    name: Docker image builds and runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t kube-ready:ci .
      - run: docker run --rm -v "$PWD/examples:/work:ro" kube-ready:ci check good --fail-on info
      - run: docker run --rm -v "$PWD/examples:/work:ro" kube-ready:ci check bad || test $? -eq 1
