[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "kube-ready"
version = "0.1.0"
description = "Is this Kubernetes manifest ready for production? A fast, opinionated linter for your CI."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Antonio" }]
keywords = ["kubernetes", "linter", "devops", "ci", "sarif", "manifests", "helm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "pyyaml>=6.0",
  "rich>=13.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
kube-ready = "kube_ready.cli:main"

[project.urls]
Homepage = "https://github.com/EA-etn/kube-ready"
Issues = "https://github.com/EA-etn/kube-ready/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/kube_ready"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
